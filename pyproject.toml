[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "D",   # pydocstyle, Home Assistant requires docstrings
  "ANN", # annotations
  "SIM",
]
ignore = [
  "ANN101", # self needs no annotation
  "ANN102", # cls needs no annotation
  "ANN401", # Any is unavoidable when parsing an undocumented payload
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"custom_components/claude_usage/binary_sensor.py" = ["ANN001"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"
