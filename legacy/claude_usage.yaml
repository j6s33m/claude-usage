# =====================================================================
# Claude Usage (Pro plan) -> Home Assistant
# Drop this in /config/packages/claude_usage.yaml
# Requires in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# SETUP: see README.md for how to get your ORG_ID and session cookie.
# Replace YOUR_ORG_ID below before this will work.
# =====================================================================

# ---------------------------------------------------------------------
# 1) HIDDEN NETWORK CALL  (the only thing that hits claude.ai)
# ---------------------------------------------------------------------
rest:
  - resource: "https://claude.ai/api/organizations/YOUR_ORG_ID/usage"
    method: GET
    scan_interval: 300
    timeout: 20
    headers:
      Cookie: !secret claude_session_cookie
      accept: "application/json"
      referer: "https://claude.ai/settings/usage"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
    sensor:
      - name: "Claude Usage Fetch"
        unique_id: claude_usage_fetch
        icon: mdi:cloud-download
        availability: >-
          {{ value_json is mapping and 'limits' in value_json }}
        value_template: >-
          {% if value_json is mapping and 'limits' in value_json %}
            {{ now().isoformat() }}
          {% else %}
            unavailable
          {% endif %}
        json_attributes:
          - five_hour
          - seven_day
          - limits

# ---------------------------------------------------------------------
# 2) RAW HOLDER + 3) POLISHED SENSORS + 5) COOKIE HEALTH
# ---------------------------------------------------------------------
template:
  # ---- RAW: flattens the nested payload back to original keys ----
  - trigger:
      - platform: state
        entity_id: sensor.claude_usage_fetch
      - platform: time_pattern
        minutes: "/1"
    sensor:
      - name: "Claude Usage Raw"
        unique_id: claude_usage_raw
        icon: mdi:database
        state: "{{ now().isoformat() }}"
        attributes:
          session_pct: "{{ (state_attr('sensor.claude_usage_fetch','five_hour') or {}).get('utilization') }}"
          session_resets_at: "{{ (state_attr('sensor.claude_usage_fetch','five_hour') or {}).get('resets_at') }}"
          session_resets: >-
            {%- set at = (state_attr('sensor.claude_usage_fetch','five_hour') or {}).get('resets_at') -%}
            {%- if at -%}{{ as_datetime(at) | as_local | as_timestamp | timestamp_custom('%a %-I:%M %p') }}{%- else -%}unknown{%- endif -%}
          week_pct: "{{ (state_attr('sensor.claude_usage_fetch','seven_day') or {}).get('utilization') }}"
          week_resets_at: "{{ (state_attr('sensor.claude_usage_fetch','seven_day') or {}).get('resets_at') }}"
          week_resets: >-
            {%- set at = (state_attr('sensor.claude_usage_fetch','seven_day') or {}).get('resets_at') -%}
            {%- if at -%}{{ as_datetime(at) | as_local | as_timestamp | timestamp_custom('%a %-I:%M %p') }}{%- else -%}unknown{%- endif -%}
          session_severity: >-
            {{ (state_attr('sensor.claude_usage_fetch','limits') or []
               | selectattr('group','eq','session') | list | first | default({})).get('severity') }}
          week_severity: >-
            {{ (state_attr('sensor.claude_usage_fetch','limits') or []
               | selectattr('group','eq','weekly') | list | first | default({})).get('severity') }}

  # ---- POLISHED: session + weekly + reset clocks ----
  - trigger:
      - platform: state
        entity_id: sensor.claude_usage_raw
      - platform: time_pattern
        minutes: "/1"
    sensor:
      # ===== SESSION (5-hour) =====
      - name: "Claude Session Usage"
        unique_id: claude_session_usage_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:gauge
        availability: "{{ state_attr('sensor.claude_usage_raw','session_pct') not in [none,'None','unknown'] }}"
        state: "{{ state_attr('sensor.claude_usage_raw','session_pct') }}"
        attributes:
          severity: "{{ state_attr('sensor.claude_usage_raw','session_severity') }}"
          session_resets: "{{ state_attr('sensor.claude_usage_raw','session_resets') }}"
          session_resets_at: "{{ state_attr('sensor.claude_usage_raw','session_resets_at') }}"
          session_resets_in: >-
            {%- set at = state_attr('sensor.claude_usage_raw','session_resets_at') -%}
            {%- if at and at not in ['None','unknown'] -%}
              {%- set delta = (as_datetime(at) - now()).total_seconds() | int -%}
              {%- if delta <= 0 -%}now
              {%- else -%}
                {%- set days = delta // 86400 -%}
                {%- set hrs = (delta % 86400) // 3600 -%}
                {%- set mins = (delta % 3600) // 60 -%}
                {%- if days > 0 -%}{{ days }}d {{ hrs }}h
                {%- elif hrs > 0 -%}{{ hrs }}h {{ mins }}m
                {%- else -%}{{ mins }}m
                {%- endif -%}
              {%- endif -%}
            {%- else -%}unknown
            {%- endif -%}
          week_pct: "{{ state_attr('sensor.claude_usage_raw','week_pct') }}"
          week_resets: "{{ state_attr('sensor.claude_usage_raw','week_resets') }}"
          week_resets_at: "{{ state_attr('sensor.claude_usage_raw','week_resets_at') }}"
          week_resets_in: >-
            {%- set at = state_attr('sensor.claude_usage_raw','week_resets_at') -%}
            {%- if at and at not in ['None','unknown'] -%}
              {%- set delta = (as_datetime(at) - now()).total_seconds() | int -%}
              {%- if delta <= 0 -%}now
              {%- else -%}
                {%- set days = delta // 86400 -%}
                {%- set hrs = (delta % 86400) // 3600 -%}
                {%- set mins = (delta % 3600) // 60 -%}
                {%- if days > 0 -%}{{ days }}d {{ hrs }}h
                {%- elif hrs > 0 -%}{{ hrs }}h {{ mins }}m
                {%- else -%}{{ mins }}m
                {%- endif -%}
              {%- endif -%}
            {%- else -%}unknown
            {%- endif -%}

      # ===== WEEKLY (7-day, all models) =====
      - name: "Claude Weekly Usage"
        unique_id: claude_weekly_usage_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:gauge
        availability: "{{ state_attr('sensor.claude_usage_raw','week_pct') not in [none,'None','unknown'] }}"
        state: "{{ state_attr('sensor.claude_usage_raw','week_pct') }}"
        attributes:
          severity: "{{ state_attr('sensor.claude_usage_raw','week_severity') }}"
          week_resets: "{{ state_attr('sensor.claude_usage_raw','week_resets') }}"
          week_resets_at: "{{ state_attr('sensor.claude_usage_raw','week_resets_at') }}"
          week_resets_in: >-
            {%- set at = state_attr('sensor.claude_usage_raw','week_resets_at') -%}
            {%- if at and at not in ['None','unknown'] -%}
              {%- set delta = (as_datetime(at) - now()).total_seconds() | int -%}
              {%- if delta <= 0 -%}now
              {%- else -%}
                {%- set days = delta // 86400 -%}
                {%- set hrs = (delta % 86400) // 3600 -%}
                {%- set mins = (delta % 3600) // 60 -%}
                {%- if days > 0 -%}{{ days }}d {{ hrs }}h
                {%- elif hrs > 0 -%}{{ hrs }}h {{ mins }}m
                {%- else -%}{{ mins }}m
                {%- endif -%}
              {%- endif -%}
            {%- else -%}unknown
            {%- endif -%}

      # ===== RESET CLOCKS (friendly local time) =====
      - name: "Claude Session Resets"
        unique_id: claude_session_resets
        icon: mdi:clock-outline
        state: "{{ state_attr('sensor.claude_usage_raw','session_resets') }}"

      - name: "Claude Weekly Resets"
        unique_id: claude_weekly_resets
        icon: mdi:calendar-clock
        state: "{{ state_attr('sensor.claude_usage_raw','week_resets') }}"

  # ---- COOKIE HEALTH: detects expired session / Cloudflare challenge ----
  - trigger:
      - platform: state
        entity_id: sensor.claude_usage_fetch
      - platform: time_pattern
        minutes: "/5"
    binary_sensor:
      - name: "Claude Cookie Stale"
        unique_id: claude_cookie_stale
        device_class: problem
        icon: mdi:cookie-alert
        delay_on:
          minutes: 30
        state: >-
          {{ state_attr('sensor.claude_usage_fetch','five_hour') in [none,'None','unknown']
             or (state_attr('sensor.claude_usage_fetch','five_hour') or {}).get('utilization') is none }}

# ---------------------------------------------------------------------
# 4) ALERTS  (weekly usage over 85%  +  cookie stale)
# ---------------------------------------------------------------------
# NOTE: replace notify.mobile_app_your_phone with your own notify service.
automation:
  - id: claude_weekly_usage_alert
    alias: "Claude - Weekly usage over 85%"
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.claude_weekly_usage
        above: 85
        for:
          minutes: 1
    action:
      - service: notify.mobile_app_your_phone
        data:
          title: "Claude weekly usage high"
          message: >-
            Weekly at {{ states('sensor.claude_weekly_usage') }}%.
            Resets in {{ state_attr('sensor.claude_weekly_usage','week_resets_in') }}.

  - id: claude_cookie_stale_alert
    alias: "Claude - Session cookie appears expired"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.claude_cookie_stale
        to: "on"
    action:
      - service: notify.mobile_app_your_phone
        data:
          title: "Claude cookie expired"
          message: >-
            Usage fetch has returned no data for 30+ minutes.
            Re-grab claude_session_cookie (and cf_clearance) and update secrets.yaml.
          data:
            push:
              interruption-level: time-sensitive
